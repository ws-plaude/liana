[package]
name = "liana-ui"
version = "15.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
iced = { workspace = true, default-features = false, features = ["svg", "image-without-codecs", "lazy", "qr_code", "advanced", "canvas"] }
# The app only decodes png (embedded window icons); enable that single codec on
# the image crate iced already pulls, instead of iced's full codec set.
image = { version = "0.25", default-features = false, features = ["png"] }
iced_aw = { workspace = true, features = ["context_menu"] }
iced_core = { workspace = true }
iced_runtime = { workspace = true }
unicode-segmentation = { workspace = true }
bitcoin = { workspace = true }
chrono = { workspace = true }
