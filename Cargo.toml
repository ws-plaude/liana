[workspace]
resolver = "2"
members = [
    "fuzz",
    "liana",
    "lianad",
    "liana-gui",
    "liana-ui",
    "liana-connect",
    "liana-business",
    "liana-business/business-installer",
]
default-members = [
    "liana",
    "lianad",
    "liana-gui",
    "liana-ui",
    "liana-connect",
    "liana-business",
    "liana-business/business-installer",
]

[workspace.dependencies]
# Internal crates
liana = { path = "liana" }
liana-gui = { path = "liana-gui", default-features = false }
liana-ui = { path = "liana-ui" }
liana-connect = { path = "liana-connect" }

# Common dependencies
miniscript = "12.0"
serde = "1.0"
log = "0.4"
toml = "0.5"
serde_json = "1.0"
iced = { version = "0.14.0", default-features = false }
iced_runtime = "0.14.0"
iced_core = "0.14.0"
jsonrpc = { version = "0.17", default-features = false }

# lianad's own wallet database. Only one crate in the graph may link the native
# sqlite3 library, so this stays the single rusqlite in the tree.
rusqlite = "0.33"

# Electrum backend: validated block headers and merkle proofs for transaction
# inclusion. lianad takes the scanner alone; the wallet half of bwk (signers,
# transaction building) is not in its graph.
bwk-electrum = { git = "https://github.com/ws-plaude/bwk", rev = "f8ee45e2a863faf5fbf5152bc83446742bd47285" }
bwk-coin = { git = "https://github.com/ws-plaude/bwk", rev = "f8ee45e2a863faf5fbf5152bc83446742bd47285" }
bwk-descriptor = { git = "https://github.com/ws-plaude/bwk", rev = "f8ee45e2a863faf5fbf5152bc83446742bd47285" }
# Without `sqlite`: lianad opens bwk's stores as JSON and keeps its own wallet
# data in its own database, so bwk's SQLite backend is never reached. Leaving it
# on would put a second rusqlite requirement in the graph and pin our version to
# whatever bwk links.
bwk-persist = { git = "https://github.com/ws-plaude/bwk", rev = "f8ee45e2a863faf5fbf5152bc83446742bd47285", default-features = false }

# liana-connect WebSocket protocol
uuid = "1.19.0"
tungstenite = "0.24"

# liana-business (installer)
thiserror = "2.0.17"

# Other dependencies
bdk_coin_select = "0.4"
getrandom = "0.3.1"
bip39 = "2.0"
fern = "0.6"
bip329 = { package = "bwk-bip329", git = "https://github.com/ws-plaude/bip329", rev = "2d56f0b4cf1ed17acca9728df72bceda8d982826", default-features = false }
bwk-hwi = { git = "https://github.com/ws-plaude/bwk", rev = "f8ee45e2a863faf5fbf5152bc83446742bd47285", default-features = false, features = ["ledger", "specter", "coldcard", "bitbox", "jade", "minreq", "service"] }
hex = "0.4.3"
futures = "0.3"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
libc = "0.2"
base64 = "0.21"
minreq = { version = "3.0", default-features = false, features = ["https-native-tls", "json-using-serde"] }
fs2 = "0.4.3"
encrypted_backup = { version = "=0.0.2", package = "bitcoin-encrypted-backup", default-features = false, features = ["miniscript_12_0", "rand"] }
zip = { version = "0.6", default-features = false }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.0", default-features = false }
winresource = "0.1.24"
unicode-segmentation = "1.0"
bitcoin = "0.32"

# Routed to our fork for native dashed/dotted border styles.
[patch.crates-io]
# softbuffer logs through tracing upstream and lets tiny-xlib turn its own on;
# this build uses the log facade the rest of the tree already has.
softbuffer = { git = "https://github.com/ws-plaude/softbuffer", rev = "03e97b98ab5d34d1eead0775948149e19de596da" }
# winit pulls tracing unconditionally upstream; this build puts it behind a
# feature we do not enable.
winit = { git = "https://github.com/ws-plaude/winit", rev = "9cd49ab8994aa178ab5b85fcf3fcc1f313f099da" }
iced = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_core = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_runtime = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_widget = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_graphics = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_renderer = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_futures = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_winit = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_wgpu = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_tiny_skia = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_program = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
iced_debug = { git = "https://github.com/ws-plaude/iced", rev = "3a4405fdd1835fe9e293032ff39d9cd71a6f5b67" }
# Fork dropping the num_enum derives, pending a 0.0.3 release upstream.
bitcoin-encrypted-backup = { git = "https://github.com/ws-plaude/bitcoin-encrypted-backup", rev = "da3a59137025b6a8106a72d897b53566aa2254ff" }
