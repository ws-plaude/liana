[package]
name = "liana-gui"
version = "15.0.0"
readme = "README.md"
description = "Liana GUI"
repository = "https://github.com/wizardsardine/liana"
license = "BSD-3-Clause"
authors = ["Edouard Paris <m@edouard.paris>"]
edition = "2018"
resolver = "2"

[package.metadata.winresource]
LegalCopyright = "Copyright © 2025"

[[bin]]
name = "liana-gui"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
bwk-hwi = { workspace = true }
liana = { path = "../liana" }
liana-connect = { workspace = true }
lianad = { path = "../lianad", default-features = false, features = ["nonblocking_shutdown"] }
liana-ui = { path = "../liana-ui" }
hex = { workspace = true }

iced = { workspace = true, default-features = false, features = ["thread-pool", "qr_code", "image-without-codecs", "lazy", "advanced", "tiny-skia", "x11", "wayland"] }
iced_aw = { workspace = true, features = ["context_menu"] }
iced_runtime = { workspace = true }

futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Used to ping bitcoind node
jsonrpc = { workspace = true, features = ["simple_http"], default-features = false }

# Logging stuff
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
log = { workspace = true }

toml = { workspace = true }

# Used for managing internal bitcoind
libc = { workspace = true }
base64 = { workspace = true }
minreq = { workspace = true }
fs2 = { workspace = true }
encrypted_backup = { workspace = true }

[target.'cfg(windows)'.dependencies]
zip = { workspace = true, default-features = false, features = ["bzip2", "deflate"] }

[target.'cfg(unix)'.dependencies]
tar = { workspace = true, default-features = false }
flate2 = { workspace = true, default-features = false }

[features]
default = ["debugger"]
debugger = []
skip-windows-icon = []

[build-dependencies]
winresource = { workspace = true }
